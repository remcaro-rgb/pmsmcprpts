services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD:-pms_readonly}
      # Login the agent uses to manage user accounts (db/init/05_users.sh).
      PMS_APP_PASSWORD: ${PMS_APP_PASSWORD:-pms_app}
    ports:
      - "${PMS_DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: loads the synthetic dataset if the database is empty.
  seed:
    build: ./db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD:-pms}@db:5432/${POSTGRES_DB:-pms}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # MCP server (streamable HTTP at http://localhost:7070/mcp), connects as the read-only role.
  mcp:
    build: ./mcp_server
    environment:
      PMS_DATABASE_URL: postgresql://pms_readonly:${PMS_READONLY_PASSWORD:-pms_readonly}@db:5432/${POSTGRES_DB:-pms}
      PMS_ARTIFACTS_DIR: /artifacts
      # Remote sign-in for ChatGPT, Claude and other MCP apps: on when PMS_PUBLIC_URL is set (see README).
      PMS_PUBLIC_URL: ${PMS_PUBLIC_URL:-}
      PMS_OIDC_ISSUER: ${PMS_OIDC_ISSUER:-}
      PMS_OIDC_CLIENT_ID: ${PMS_OIDC_CLIENT_ID:-}
      PMS_OIDC_CLIENT_SECRET: ${PMS_OIDC_CLIENT_SECRET:-}
      PMS_ALLOWED_EMAILS: ${PMS_ALLOWED_EMAILS:-}
      PMS_ALLOWED_DOMAINS: ${PMS_ALLOWED_DOMAINS:-}
      PMS_ALLOW_ANY_USER: ${PMS_ALLOW_ANY_USER:-}
      PMS_MCP_SERVICE_TOKEN: ${PMS_MCP_SERVICE_TOKEN:-}
      # Which hotels each user sees (row-level security); see .env.example.
      PMS_HOTEL_ACCESS: ${PMS_HOTEL_ACCESS:-}
      # "true": the website's user accounts decide instead (each user's assigned hotels; all for admins).
      PMS_USER_DIRECTORY: ${PMS_USER_DIRECTORY:-}
      PMS_AUTH_DB: /data/auth.sqlite
      # Public traffic arrives through Caddy or the Cloudflare tunnel, which set X-Forwarded-For
      # (used for rate limits).
      PMS_TRUST_PROXY: "true"
      # "off" turns the per-IP rate limits off (see README).
      PMS_RATE_LIMIT: ${PMS_RATE_LIMIT:-on}
    volumes:
      - artifacts:/artifacts
      - mcpdata:/data
    ports:
      - "127.0.0.1:${PMS_MCP_PORT:-7070}:7070"
    depends_on:
      db:
        condition: service_healthy

  # Claude agent API: POST http://localhost:7001/api/chat streams answers as server-sent events.
  agent:
    build: ./agent
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PMS_MCP_URL: http://mcp:7070/mcp
      PMS_MCP_TOKEN: ${PMS_MCP_SERVICE_TOKEN:-}
      PMS_CLAUDE_MODEL: ${PMS_CLAUDE_MODEL:-claude-sonnet-5-5}
      PMS_CLAUDE_EFFORT: ${PMS_CLAUDE_EFFORT:-medium}
      PMS_ARTIFACTS_DIR: /artifacts
      PMS_CONVERSATIONS_DB: /data/conversations.sqlite
      # The day's recommendations are made again at midnight here.
      PMS_TIMEZONE: ${PMS_TIMEZONE:-${FNS_TIMEZONE:-Europe/Madrid}}
      # User accounts (sign-in, admin page); see .env.example.
      PMS_APP_DATABASE_URL: ${PMS_APP_DATABASE_URL:-}
      # The daily email (off without SMTP_HOST); see .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      PMS_DIGEST_TIME: ${PMS_DIGEST_TIME:-07:00}
      PMS_SITE_URL: ${WEB_PUBLIC_URL:-http://localhost:5050}
    volumes:
      - artifacts:/artifacts:ro
      - agentdata:/data
    ports:
      - "127.0.0.1:${PMS_AGENT_PORT:-7001}:7001"
    depends_on:
      - mcp

  # Chat website at http://localhost:5050; proxies /api/chat to the agent.
  web:
    build: ./web
    environment:
      AGENT_URL: http://agent:7001
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-20/600}
      # Website sign-in (off unless WEB_AUTH=password or oidc); see .env.example.
      WEB_AUTH: ${WEB_AUTH:-}
      # Optional site-wide password ("user:password"), e.g. for a Cloudflare quick tunnel.
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_OIDC_CLIENT_ID: ${WEB_OIDC_CLIENT_ID:-}
      WEB_OIDC_CLIENT_SECRET: ${WEB_OIDC_CLIENT_SECRET:-}
      PMS_OIDC_ISSUER: ${PMS_OIDC_ISSUER:-}
      PMS_OIDC_CLIENT_ID: ${PMS_OIDC_CLIENT_ID:-}
      PMS_OIDC_CLIENT_SECRET: ${PMS_OIDC_CLIENT_SECRET:-}
      PMS_ALLOWED_EMAILS: ${PMS_ALLOWED_EMAILS:-}
      PMS_ALLOWED_DOMAINS: ${PMS_ALLOWED_DOMAINS:-}
      PMS_ALLOW_ANY_USER: ${PMS_ALLOW_ANY_USER:-}
      TRUST_PROXY: ${WEB_TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:${PMS_WEB_PORT:-5050}:5050"
    depends_on:
      - agent

  # Daily import from the FNSrooms PMS API (FNS_* in .env; on with COMPOSE_PROFILES=fns).
  # Run by hand: docker compose run --rm fns-sync python -m fns_sync check|run|status
  fns-sync:
    build: ./fns_sync
    profiles: ["fns"]
    environment:
      FNS_DATABASE_URL: postgresql://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD:-pms}@db:5432/${POSTGRES_DB:-pms}
      FNS_USER: ${FNS_USER:-}
      FNS_PASSWORD: ${FNS_PASSWORD:-}
      FNS_CENTRAL_ID: ${FNS_CENTRAL_ID:-}
      FNS_ALOJAMIENTO_ID: ${FNS_ALOJAMIENTO_ID:-}
      FNS_PMS_ID: ${FNS_PMS_ID:-}
      FNS_HOTEL_NAME: ${FNS_HOTEL_NAME:-Fragata}
      FNS_HOTEL_CODE: ${FNS_HOTEL_CODE:-FRA}
      FNS_HOTEL_CITY: ${FNS_HOTEL_CITY:-}
      FNS_HOTEL_COUNTRY: ${FNS_HOTEL_COUNTRY:-}
      FNS_TIMEZONE: ${FNS_TIMEZONE:-Europe/Madrid}
      FNS_MONEDA_ID: ${FNS_MONEDA_ID:-}
      FNS_CURRENCY: ${FNS_CURRENCY:-}
      FNS_SYNC_TIME: ${FNS_SYNC_TIME:-03:00}
      FNS_BACKFILL_DAYS: ${FNS_BACKFILL_DAYS:-365}
    volumes:
      - ./db/init/06_fns.sql:/app/schema.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Public HTTPS for the MCP server: docker compose --profile public up -d
  caddy:
    image: caddy:2.10
    profiles: ["public"]
    environment:
      PMS_DOMAIN: ${PMS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp

  # Share the website through a Cloudflare Tunnel: outbound connections only, no open ports.
  # Named tunnel on your own domain (token from the Cloudflare Zero Trust dashboard):
  #   docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
    restart: unless-stopped

  # Quick tunnel: no account or domain; a random https://….trycloudflare.com address each start.
  # Set WEB_PASSWORD (or WEB_AUTH) first. See scripts/share_cloudflare.sh.
  quicktunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["quicktunnel"]
    command: tunnel --no-autoupdate --url http://web:5050
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  # Saved conversations (agent).
  agentdata:
  mcpdata:
  caddy_data:
  # Generated charts and documents: written by mcp, served for download by agent.
  artifacts:
