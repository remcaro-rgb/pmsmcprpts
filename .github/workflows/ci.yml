name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python, web unit, browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pms
          POSTGRES_PASSWORD: pms
          POSTGRES_DB: pms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pms -d pms" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: pms
      PGPASSWORD: pms
      DATABASE_URL: postgresql://pms:pms@localhost:5432/pms
      PMS_TEST_ADMIN_URL: postgresql://pms:pms@localhost:5432/postgres
      PMS_TEST_DATABASE_URL: postgresql://pms_readonly:pms_readonly@localhost:5432/pms
      PMS_DATABASE_URL: postgresql://pms_readonly:pms_readonly@localhost:5432/pms
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "*/requirements*.txt"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          pip install -r db/requirements-dev.txt -r mcp_server/requirements-dev.txt -r agent/requirements-dev.txt pyflakes
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Lint Python
        run: python -m pyflakes db mcp_server agent web/e2e/fake_agent.py

      - name: Create schema and seed the sample data
        run: |
          psql -d pms -v ON_ERROR_STOP=1 -q -f db/init/01_schema.sql -f db/init/02_views.sql
          POSTGRES_USER=pms POSTGRES_DB=pms PMS_READONLY_PASSWORD=pms_readonly bash db/init/03_readonly_role.sh
          python db/seed.py

      - name: Python tests
        run: python -m pytest -q

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Web typecheck and unit tests
        working-directory: web
        run: |
          npx tsc --noEmit
          npm test

      - name: Web build
        working-directory: web
        run: npm run build

      - name: Browser tests
        working-directory: web
        env:
          CI: "1"
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose --profile public config -q
      - name: Build images
        run: docker compose build
