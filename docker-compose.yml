services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pms}
      POSTGRES_DB: ${POSTGRES_DB:-pms}
      PMS_READONLY_PASSWORD: ${PMS_READONLY_PASSWORD:-pms_readonly}
    ports:
      - "${PMS_DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: loads the synthetic dataset if the database is empty.
  seed:
    build: ./db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pms}:${POSTGRES_PASSWORD:-pms}@db:5432/${POSTGRES_DB:-pms}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # MCP server (streamable HTTP at http://localhost:7070/mcp), connects as the read-only role.
  mcp:
    build: ./mcp_server
    environment:
      PMS_DATABASE_URL: postgresql://pms_readonly:${PMS_READONLY_PASSWORD:-pms_readonly}@db:5432/${POSTGRES_DB:-pms}
      PMS_ARTIFACTS_DIR: /artifacts
      # Remote sign-in for Claude custom connectors: on when PMS_PUBLIC_URL is set (see README).
      PMS_PUBLIC_URL: ${PMS_PUBLIC_URL:-}
      PMS_OIDC_ISSUER: ${PMS_OIDC_ISSUER:-}
      PMS_OIDC_CLIENT_ID: ${PMS_OIDC_CLIENT_ID:-}
      PMS_OIDC_CLIENT_SECRET: ${PMS_OIDC_CLIENT_SECRET:-}
      PMS_ALLOWED_EMAILS: ${PMS_ALLOWED_EMAILS:-}
      PMS_ALLOWED_DOMAINS: ${PMS_ALLOWED_DOMAINS:-}
      PMS_MCP_SERVICE_TOKEN: ${PMS_MCP_SERVICE_TOKEN:-}
      PMS_AUTH_DB: /data/auth.sqlite
    volumes:
      - artifacts:/artifacts
      - mcpdata:/data
    ports:
      - "127.0.0.1:${PMS_MCP_PORT:-7070}:7070"
    depends_on:
      db:
        condition: service_healthy

  # Claude agent API: POST http://localhost:7001/api/chat streams answers as server-sent events.
  agent:
    build: ./agent
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PMS_MCP_URL: http://mcp:7070/mcp
      PMS_MCP_TOKEN: ${PMS_MCP_SERVICE_TOKEN:-}
      PMS_CLAUDE_MODEL: ${PMS_CLAUDE_MODEL:-claude-opus-5-5}
      PMS_CLAUDE_EFFORT: ${PMS_CLAUDE_EFFORT:-medium}
      PMS_ARTIFACTS_DIR: /artifacts
    volumes:
      - artifacts:/artifacts:ro
    ports:
      - "127.0.0.1:${PMS_AGENT_PORT:-7001}:7001"
    depends_on:
      - mcp

  # Chat website at http://localhost:5050; proxies /api/chat to the agent.
  web:
    build: ./web
    environment:
      AGENT_URL: http://agent:7001
    ports:
      - "127.0.0.1:${PMS_WEB_PORT:-5050}:5050"
    depends_on:
      - agent

  # Public HTTPS for the MCP server: docker compose --profile public up -d
  caddy:
    image: caddy:2.10
    profiles: ["public"]
    environment:
      PMS_DOMAIN: ${PMS_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - mcp

volumes:
  pgdata:
  mcpdata:
  caddy_data:
  # Generated charts and documents: written by mcp, served for download by agent.
  artifacts:
